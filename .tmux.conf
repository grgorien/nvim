set -g prefix C-q
unbind C-b
bind-key C-q send-prefix

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i --clipboard"

unbind %
bind-key | split-window -h


unbind '"'
bind-key _ split-window -v

unbind r
bind r source-file ~/.tmux.conf


# navigation & resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5

bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z


bind-key -n 'C-Space' send-keys 'C-l'

# sessionizer
bind-key f display-popup -E -w 80% -h 80% "~/.local/bin/t"
bind-key -n M-f display-popup -E -w 80% -h 80% "~/.local/bin/t"

set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*:RGB"
set -g set-clipboard off # stops injecting escape codes
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# nvim-tmux integration
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"

if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"


bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# theme
set -as terminal-features ",xterm-256color:RGB"

set -g status-style "bg=#181818,fg=#e4e4ef"

setw -g window-status-current-style "bg=#ffdd33,fg=#181818,bold"
setw -g window-status-current-format " #I:#W "

setw -g window-status-style "bg=#282828,fg=#e4e4ef"
setw -g window-status-format " #I:#W "

set -g pane-active-border-style "fg=#ffdd33"
set -g pane-border-style "fg=#282828"

set -g message-style "bg=#181818,fg=#ffdd33,bold"

set -g status-left-length 40
set -g status-left "#[bg=#ffdd33,fg=#181818,bold] [#S] #[default] "

set -g status-right-length 150
set -g status-right "#[fg=#e4e4ef,bg=#282828] %Y-%m-%d │ %H:%M "

set -g window-status-separator " "

run '~/.tmux/plugins/tpm/tpm'
